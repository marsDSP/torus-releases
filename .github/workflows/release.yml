name: Release build

# Dispatched by marsDSP/Torus's release-dispatch.yml (called from beta.yml
# and linux.yml; never run directly on a fork/PR here). Builds the private
# source at the given ref for the requested platforms and publishes
# the resulting binaries as a release in THIS repo. Source is checked out
# into an ephemeral runner workspace only — never committed here.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or commit SHA) in marsDSP/Torus to build"
        required: true
      version:
        description: "Version label for the release title"
        required: true
      # Torus dispatches macOS + Windows once its macOS CI is green, and
      # Linux once its Linux CI is green, with the same version, so both
      # land in one release.
      platforms:
        description: 'JSON array of platforms to build ("macOS", "Windows", "Linux")'
        required: false
        default: '["macOS","Windows","Linux"]'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    # The matrix is the requested platform list; the runner image comes from
    # this map, since include entries cannot be filtered by an input. Linux
    # is pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19.
    runs-on: ${{ fromJSON('{"macOS":"macos-latest","Windows":"windows-latest","Linux":"ubuntu-24.04"}')[matrix.name] }}
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(github.event.inputs.platforms || '["macOS","Windows","Linux"]') }}
    steps:
      - name: Checkout Torus source (private, transient)
        uses: actions/checkout@v4
        with:
          repository: marsDSP/Torus
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.TORUS_SOURCE_PAT }}
          submodules: recursive

      - name: Install JUCE Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update

          WEBKIT_CANDIDATES="libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.2-dev libwebkit2gtk-4.3-dev"
          WEBKIT_PKG=""
          for p in $WEBKIT_CANDIDATES; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              WEBKIT_PKG="$p"
              break
            fi
          done

          if [ -z "$WEBKIT_PKG" ]; then
            echo "No libwebkit2gtk-dev package found in apt repos; aborting."
            exit 1
          fi

          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcomposite-dev libxinerama-dev libxcursor-dev \
            libxrandr-dev libxext-dev libfreetype6-dev libasound2-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config \
            libgtk-3-dev "$WEBKIT_PKG" libfontconfig1-dev \
            libgdk-pixbuf2.0-dev

      - name: Install modern GCC (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          # As in Torus's linux.yml: the LTO static libraries need GCC 14's
          # ar/ranlib wrappers, or the plugin link misses juce:: symbols.
          echo "CMAKE_EXTRA=-DCMAKE_AR=/usr/bin/gcc-ar-14 -DCMAKE_RANLIB=/usr/bin/gcc-ranlib-14" >> "$GITHUB_ENV"

      # Torus refuses a Release configure without a future beta end date.
      # Repo variable TORUS_BETA_END pins one; otherwise today + 30 days.
      - name: Beta end date
        shell: bash
        run: |
          END="${{ vars.TORUS_BETA_END }}"
          [ -n "$END" ] || END=$(date -u -d '+30 days' +%F 2>/dev/null || date -u -v+30d +%F)
          echo "TORUS_BETA_END=$END" >> "$GITHUB_ENV"

      # Release artefacts only: the tests ran in Torus's CI before dispatch.
      # The version is also the release tag; the plugin's update check
      # compares it with the newest release on lissajouslabs.com.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTORUS_BETA_END=${{ env.TORUS_BETA_END }} -DTORUS_RELEASE_TAG=${{ github.event.inputs.version }} -DTORUS_BUILD_TESTS=OFF ${{ env.CMAKE_EXTRA }}

      # A bare -j is unbounded under make: a Linux runner was shut down
      # mid-compile. Four jobs match the hosted runners' core counts.
      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/Torus_artefacts/Release
          zip -r -y "$GITHUB_WORKSPACE/Torus-${{ github.event.inputs.version }}-macOS.zip" \
            VST3/Torus.vst3 AU/Torus.component CLAP/Torus.clap Standalone/Torus.app

      # Unsigned for now: Gatekeeper quarantines the download, so the image
      # carries a note on clearing it. Drag targets cover the system folders.
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          A=build/Torus_artefacts/Release
          S="$RUNNER_TEMP/Torus"
          mkdir -p "$S"
          cp -R "$A/VST3/Torus.vst3" "$A/AU/Torus.component" "$A/CLAP/Torus.clap" "$A/Standalone/Torus.app" "$S/"
          ln -s /Library/Audio/Plug-Ins/VST3 "$S/VST3 Plug-Ins"
          ln -s /Library/Audio/Plug-Ins/Components "$S/AU Plug-Ins (Components)"
          ln -s /Library/Audio/Plug-Ins/CLAP "$S/CLAP Plug-Ins"
          ln -s /Applications "$S/Applications"
          cat > "$S/Install.txt" <<'EOF'
          Drag Torus.vst3 onto "VST3 Plug-Ins", Torus.component onto
          "AU Plug-Ins (Components)", Torus.clap onto "CLAP Plug-Ins", and
          Torus.app onto "Applications". If the CLAP folder does not exist
          yet, create it first: sudo mkdir -p /Library/Audio/Plug-Ins/CLAP

          This beta is not signed yet. If macOS or your DAW blocks it, run this
          once in Terminal, then rescan plug-ins in your DAW:

          sudo xattr -dr com.apple.quarantine /Library/Audio/Plug-Ins/VST3/Torus.vst3 /Library/Audio/Plug-Ins/Components/Torus.component /Library/Audio/Plug-Ins/CLAP/Torus.clap /Applications/Torus.app
          EOF
          hdiutil create -volname "Torus" -srcfolder "$S" -ov -format UDZO \
            "$GITHUB_WORKSPACE/Torus-${{ github.event.inputs.version }}-macOS.dmg"

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/Torus_artefacts/Release/VST3/Torus.vst3, `
                  build/Torus_artefacts/Release/CLAP/Torus.clap, `
                  build/Torus_artefacts/Release/Standalone/Torus.exe `
            -DestinationPath Torus-${{ github.event.inputs.version }}-Windows.zip

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/Torus_artefacts/Release
          zip -r -y "$GITHUB_WORKSPACE/Torus-${{ github.event.inputs.version }}-Linux.zip" \
            VST3/Torus.vst3 CLAP/Torus.clap Standalone/Torus

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Torus-${{ github.event.inputs.version }}-${{ matrix.name }}
          path: |
            Torus-*.zip
            Torus-*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Publish whatever built; the macOS DMG is required when macOS was
    # requested. A dispatch whose version already has a release adds its
    # assets to it. The per-ref concurrency group serialises the two
    # dispatches of one commit, so they never race on the create.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.inputs.version }}
          REF: ${{ github.event.inputs.ref }}
          PLATFORMS: ${{ github.event.inputs.platforms || '["macOS","Windows","Linux"]' }}
        run: |
          set -euo pipefail
          case "$PLATFORMS" in *macOS*) ls dist/Torus-*-macOS.dmg ;; esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/Torus-* --clobber
          else
            gh release create "$VERSION" dist/Torus-* \
              --title "Torus $VERSION" \
              --notes "Built from marsDSP/Torus @ $REF."
          fi
